<script>

var CREDIT_NAME = '우리 조카';  // 엔딩 크레딧에 나오는 원작자 이름

// ── 이미지 ──

IMG.retry = {};

}
// 처음 화면에 필요한 것만 미리 읽고, 나머지는 장면에 들어갈 때 읽음 (메모리 절약)
['bg/title.png', 'bg/castle_hall.png', 'chars/aurora_portrait.png', 'chars/luna_smile.png', 'chars/kayra_princess.png',

// 웹 배포본은 에셋이 따로 된 파일 → 첫 화면이 뜬 뒤 하나씩 받아 브라우저 캐시에 넣어둠 (장면 바뀔 때 빈 화면 방지)
setTimeout(function () {
  if (!window.fetch) return;
  var urls = Object.keys(window.ASSET_DATA).map(function (k) { return window.ASSET_DATA[k]; })
    .filter(function (u) { return u.indexOf('data:') !== 0; });

    var u = urls.shift();

function drawImg(key, x, y, w, h, alpha) {

}
function drawBg(key, fallback) {

      var s = W / im.width, h = im.height * s;

// ── 저장 ──
var SAVE_KEY = 'aurora_save_v2';

}

// 이전 버전 저장 데이터: 1부를 깬 사람은 1부 친구들을 이미 만난 것으로
if (save.cleared.indexOf('final') >= 0) ['aurora', 'luna', 'kayra', 'fairy', 'rabbit', 'cat', 'shadow'].forEach(meet);

// ─────────────────────────────────────────────
// 소리: 효과음은 Web Audio 버퍼, 배경음악은 <audio> → GainNode (iOS에서도 볼륨 페이드 가능)

var SFX_NAMES = ['tap', 'next', 'found', 'miss', 'rotate', 'lit0', 'lit1', 'lit2', 'lit3', 'melody', 'shard', 'clear', 'hint', 'page'];
var BGM_NAMES = ['cute', 'polka', 'sad', 'waltz', 'adventure'];

    }).catch(function () {});

}

// 합성음 (파일을 아직 못 읽었을 때 대체 + 리듬게임 음표)

// ─────────────────────────────────────────────

// ── UI 헬퍼 ──
function rr(x, y, w, h, r) {

function Button(label, x, y, w, h, onTap, color) {

function drawButton(b) {

}

function muteBtn() { return { x: 18, y: H - 92, w: 74, h: 74 }; }

  ctx.beginPath(); ctx.arc(b.x + 37, b.y + 37, 34, 0, 7); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();

}
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// 반짝이 입자 (최대 80개)
var sparks = [];
function burst(x, y, n, colors) {
  for (var i = 0; i < n && sparks.length < 80; i++) {
    var a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
    sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 100, life: 0.8 + Math.random() * 0.5, t: 0,

}

  sparks.forEach(function (p) { ctx.globalAlpha = 1 - p.t / p.life; drawStar(p.x, p.y, p.s, p.c, p.t * 6); });
  ctx.globalAlpha = 1;
}

// 화면 전환 페이드
var fade = { a: 0, dir: 0, then: null };

}

// 상단 제목 패널 (미니게임 공통)

// ─────────────────────────────────────────────
// 캐릭터 · 추억 조각

var CAST = {

function StoryScene(key, startStep) {
  var queue = STORY[key].slice();
  var bg = 'bg/castle_hall.png';
  var cur = null, shown = 0, typing = false, choices = null;
  var skipTo = startStep || 0, stepIdx = 0;
  save.scene = key; save.step = 0; writeSave();
  // 이 장면에 쓰일 그림 미리 읽기
  STORY[key].forEach(function (c) { if (c.bg) IMG(c.bg); if (c.who) IMG(CAST[c.who].faces[c.face] || CAST[c.who].faces.smile); });

  function next() {
    choices = null;
    while (queue.length) {
      var c = queue.shift(); stepIdx++;
      if (c.bg) { bg = c.bg; if (c.bgm) playBgm(c.bgm); continue; }
      if (c.ifShard) { queue = (hasShard(c.ifShard) ? c.yes : c.no).concat(queue); continue; }
      if (c.ribbon) { if (stepIdx > skipTo) getRibbon(c.ribbon); continue; }
      if (c.go) { runGo(c); return; }
      if (stepIdx <= skipTo && !c.choice) continue;
      cur = c; shown = 0; typing = true;
      if (c.who) meet(c.who);
      save.step = stepIdx; writeSave();
      if (c.choice) {
        typing = false;
        choices = c.choice.map(function (ch, i) {
          return Button(ch.t, SX + 170, 380 + i * 150, 1100, 110, function () {
            save.heart += ch.heart; writeSave();
            queue.unshift(ch.reply); next();
          }, i ? '#8fb8ff' : '#ff8fc4');
        });
      }
      return;
    }
  }
  next();

  return {
    update: function (dt) {
      if (typing && cur && cur.view) typing = false;
      if (typing && cur) {
        var full = (cur.t || cur.n).length;
        shown = Math.min(full, shown + dt * 38);
        if (shown >= full) typing = false;
        dirty = true;
      }
      if (!typing && cur && !cur.choice) dirty = true; // 넘김 별 깜빡임
    },
    draw: function () {
      drawBg(bg);
      if (bg === 'bg/concert_stage.png') drawStageRainbow(bg);
      if (!cur) return;
      if (cur.choice) {
        ctx.fillStyle = 'rgba(40,20,60,0.35)'; ctx.fillRect(0, 0, W, H);

        choices.forEach(drawButton);

      if (cur.view) { text('화면을 누르면 계속', SX + 1400, H - 30, 26, 'rgba(255,255,255,' + (0.6 + Math.sin(T * 4) * 0.4) + ')', 'right', 700); return; }
      var str = (cur.t || cur.n).slice(0, Math.floor(shown));
      if (cur.n) {
        var ls = wrap(cur.n, 1100, 44);
        var bandH = Math.max(300, ls.length * 66 + 120);

function HiddenScene(setId) {

  save.scene = set.kind; writeSave(); playBgm(set.bgm);
  SPOTS.forEach(function (sp) { IMG(sp.key); }); IMG(set.icon); IMG(set.bg);
  var found = SPOTS.map(function (sp) { return !!(sp.shard && hasShard(sp.shard)); });
  var hintT = 0, hintIdx = -1, cooldown = 0, done = false, doneT = 0;
  var hintBtn = Button(set.hint, SX + 1440 - 300, 30, 270, 90, null, '#e8a917');
  function gemsLeft() { var n = 0; for (var i = 0; i < 5; i++) if (!found[i]) n++; return n; }
  function pos(sp) { var r = bgRect(set.bg); return { x: r.x + sp.fx * r.w, y: r.y + sp.fy * r.h }; }
  return {
    update: function (dt) {
      if (hintT > 0) hintT -= dt;

      dirty = true;
    },
    draw: function () {
      drawBg(set.bg);

        drawImg(sp.key, -sp.s / 2, -sp.s / 2, sp.s, sp.s, 0.92);

        text(Math.ceil(cooldown) + '초', hintBtn.x + hintBtn.w / 2, hintBtn.y + 46, 36, '#8a6a20', 'center', 800);
      }

        return;

function LightScene(levelIdx, setId) {

  var resetBtn = Button('처음으로', SX + 1440 - 260, 30, 230, 90, null, '#8fb8ff');

  function trace() {
    segs = []; lit = {}; shardLit = false;

    for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) if (DIRS[grid[y][x]]) beams.push([x, y, DIRS[grid[y][x]][0], DIRS[grid[y][x]][1]]);

      var pts = [[cx, cy]];

        var k = cx + ',' + cy + ',' + dx + ',' + dy;
        if (seen[k]) { pts.push([cx, cy]); break; }
        seen[k] = 1;
        pts.push([cx, cy]);
        var t = grid[cy][cx];
        if (t === 'R') break;
        if (t === 'L') lit[cx + ',' + cy] = 1;
        if (t === 'H') shardLit = true;
        if (t === '/' || t === 'F') { var a = dx; dx = -dy; dy = -a; }
        else if (t === '\\' || t === 'G') { var c2 = dx; dx = dy; dy = c2; }

  };

          msg = CAKE_PARTS[b.k].top && !nextTop ? '장식은 맨 마지막에 올려요!' : nextTop ? '주문서의 장식을 다시 봐요!' : '주문서 순서를 다시 봐요! 아래층부터예요';
        }
        return;
      }
    },
    dbg: function () { return { stack: stack, need: need(), clear: clear, btns: btns }; }
  };
}

// ─────────────────────────────────────────────
// 7장: 눈꽃 왕국 얼음 미끄럼 퍼즐. 레벨은 tools/gen_ice.py 로 생성, check 로 검증
// # 얼음 벽 / S 눈사람 / o 눈더미(들어서면 멈춤) / . 빙판 / @ 시작 / G 파란 리본(여기 멈춰야 성공)
// ─────────────────────────────────────────────
var ICE_LEVELS = [
  { name: '꽁꽁 호수', best: 3, map: [
    '@..#..',
    '#....G',
    '..S...',
    '....#.',
    '.S....' ] },
  { name: '눈사람 친구들', best: 5, map: [
    'G..#..',
    '....o.',
    '..S...',
    '#...#S',
    '..S#..',
    '..@...' ] },
  { name: '눈더미 숲', best: 7, map: [
    '.S..@..',
    '..S....',
    'S..oS..',
    '..SG..S',
    '.S....#',
    '...#o..' ] },
  { name: '얼음 궁전 앞마당', best: 9, map: [
    '...S.o@.',
    '#....#..',
    '.S....#.',
    '.SS.....',
    '#.G.S...',
    '...#..oS',
    '...#....' ] }
];
// ICE_END
function IceScene(levelIdx) {
  levelIdx = levelIdx || 0;
  save.scene = 'ice'; save.step = levelIdx; writeSave(); playBgm('waltz');
  ['items/ice_floor.png', 'items/ice_block.png', 'items/snowman.png', 'items/ribbon_blue.png', 'bg/snow_kingdom.png'].forEach(IMG);
  var lv = ICE_LEVELS[levelIdx], g = lv.map, rows = g.length, cols = g[0].length, p = null, goal = null;
  g.forEach(function (r, y) { r.split('').forEach(function (c, x) { if (c === '@') p = { x: x, y: y }; if (c === 'G') goal = { x: x, y: y }; }); });
  var cell = Math.min(120, Math.floor(Math.min(980 / cols, 780 / rows)));
  var ox = SX + 60 + (1000 - cols * cell) / 2, oy = 170 + (800 - rows * cell) / 2;
  var anim = null, moves = 0, history = [], clear = false, clearT = 0, trail = [];
  var pad = { cx: SX + 1250, cy: 680, r: 82 };
  var btns = [
    Button('되돌리기', SX + 1120, 200, 260, 90, function () { if (anim || clear || !history.length) return; p = history.pop(); moves--; }, '#8fb8ff'),
    Button('처음으로', SX + 1120, 310, 260, 90, function () { scene = IceScene(levelIdx); }, '#c9a0b8')
  ];
  function blocked(x, y) { return x < 0 || y < 0 || x >= cols || y >= rows || g[y][x] === '#' || g[y][x] === 'S'; }
  function slide(dx, dy) {
    if (anim || clear) return;
    var x = p.x, y = p.y;
    while (!blocked(x + dx, y + dy)) { x += dx; y += dy; if (g[y][x] === 'o') break; }
    if (x === p.x && y === p.y) { SFX.miss(); return; }
    history.push({ x: p.x, y: p.y });
    anim = { fx: p.x, fy: p.y, t: 0, dur: Math.max(0.15, (Math.abs(x - p.x) + Math.abs(y - p.y)) * 0.075) };
    p = { x: x, y: y }; moves++; SFX.rotate();
  }
  function padDir(x, y) {
    var dx = x - pad.cx, dy = y - pad.cy;
    if (Math.hypot(dx, dy) > pad.r * 2.6) return null;
    if (Math.abs(dx) > Math.abs(dy)) return [dx > 0 ? 1 : -1, 0];
    return [0, dy > 0 ? 1 : -1];
  }
  function pos() {
    if (!anim) return { x: p.x, y: p.y };
    var k = Math.min(1, anim.t / anim.dur); k = 1 - (1 - k) * (1 - k);
    return { x: anim.fx + (p.x - anim.fx) * k, y: anim.fy + (p.y - anim.fy) * k };
  }
  return {
    update: function (dt) {
      if (anim) {
        anim.t += dt;
        var q = pos(); trail.push({ x: q.x, y: q.y, life: 0.4 });
        if (anim.t >= anim.dur) {
          anim = null;
          if (p.x === goal.x && p.y === goal.y) {
            clear = true; SFX.melody(); save.stars += 2; writeSave();
            burst(ox + goal.x * cell + cell / 2, oy + goal.y * cell + cell / 2, 30, ['#8fd3ff', '#fff', '#4f9ee8']);
          } else if (g[p.y][p.x] === 'o') SFX.tap();
        }
      }
      trail.forEach(function (t) { t.life -= dt; }); trail = trail.filter(function (t) { return t.life > 0; });
      if (clear) {
        clearT += dt;
        if (clearT > 2.2) {
          clear = false;
          if (levelIdx + 1 < ICE_LEVELS.length) go(function () { return IceScene(levelIdx + 1); });
          else finishGame('ice');
        }
      }
      dirty = true;
    },
    draw: function () {
      drawBg('bg/snow_kingdom.png', ['#cfe8ff', '#8fb8e8']);
      ctx.fillStyle = 'rgba(20,40,80,0.25)'; ctx.fillRect(0, 0, W, H);
      headerPanel('7장 · ' + (levelIdx + 1) + '/' + ICE_LEVELS.length + '  ' + lv.name, '쭉 미끄러져요! 리본 위에 딱 멈추면 성공', '#6aa6d8');
      rr(ox - 14, oy - 14, cols * cell + 28, rows * cell + 28, 24); ctx.fillStyle = 'rgba(230,245,255,0.5)'; ctx.fill();
      for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
        var c = g[y][x], px = ox + x * cell, py = oy + y * cell;
        if (c === '#') { drawImg('items/ice_block.png', px, py, cell, cell); continue; }
        if (!drawImg('items/ice_floor.png', px, py, cell, cell)) { ctx.fillStyle = (x + y) % 2 ? '#dff1ff' : '#cfe8fb'; ctx.fillRect(px, py, cell, cell); }
        if (c === 'S') drawImg('items/snowman.png', px + 4, py - 6, cell - 8, cell - 2);
        if (c === 'o') {
          ctx.fillStyle = '#ffffff';
          [[0.3, 0.62, 0.26], [0.62, 0.6, 0.3], [0.47, 0.42, 0.26]].forEach(function (b) { ctx.beginPath(); ctx.ellipse(px + cell * b[0], py + cell * b[1], cell * b[2], cell * b[2] * 0.8, 0, 0, 7); ctx.fill(); });
          ctx.lineWidth = 3; ctx.strokeStyle = '#a8c8e8'; ctx.stroke();
        }
      }
      // 리본(목표)
      var gp = 1 + Math.sin(T * 4) * 0.06;
      ctx.beginPath(); ctx.arc(ox + goal.x * cell + cell / 2, oy + goal.y * cell + cell / 2, cell * 0.46, 0, 7); ctx.fillStyle = 'rgba(255,240,150,0.45)'; ctx.fill();
      drawImg('items/ribbon_blue.png', ox + goal.x * cell + cell * (0.5 - 0.42 * gp), oy + goal.y * cell + cell * (0.5 - 0.42 * gp), cell * 0.84 * gp, cell * 0.84 * gp);
      trail.forEach(function (t) { ctx.globalAlpha = t.life; drawStar(ox + t.x * cell + cell / 2, oy + t.y * cell + cell / 2, 10, '#fff', T * 4); }); ctx.globalAlpha = 1;
      var q = pos(), pcx = ox + q.x * cell + cell / 2, pcy = oy + q.y * cell + cell / 2;
      drawFace('chars/aurora_portrait.png', pcx, pcy, cell * 0.42, 1.7, 0.3);
      ctx.beginPath(); ctx.arc(pcx, pcy, cell * 0.42, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = '#ff6fae'; ctx.stroke();
      btns.forEach(drawButton);
      text('미끄러진 횟수 ' + moves, SX + 1250, 450, 30, '#fff', 'center', 700);
      text('최소 ' + lv.best + '번이면 돼요', SX + 1250, 495, 26, '#e0f0ff', 'center', 600);
      [[0, -1, '▲'], [0, 1, '▼'], [-1, 0, '◀'], [1, 0, '▶']].forEach(function (d) {
        var bx = pad.cx + d[0] * pad.r * 1.25, by = pad.cy + d[1] * pad.r * 1.25;
        ctx.beginPath(); ctx.arc(bx, by, pad.r * 0.62, 0, 7); ctx.fillStyle = 'rgba(106,166,216,0.92)'; ctx.fill();
        ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
        text(d[2], bx, by + 2, 46, '#fff', 'center', 900);
      });
      if (clear) outlined(levelIdx + 1 < ICE_LEVELS.length ? '리본에 딱 멈췄어요!' : '파란 리본을 찾았어요!', W / 2, H - 70, 60, '#fff', '#4f9ee8', 14);
    },
    tap: function (x, y) {
      if (tapButtons(btns, x, y)) return;
      var d = padDir(x, y);
      if (d) { slide(d[0], d[1]); return; }
      var gx = Math.floor((x - ox) / cell), gy = Math.floor((y - oy) / cell);
      if (gx < 0 || gy < 0 || gx >= cols || gy >= rows) return;
      var ddx = gx - p.x, ddy = gy - p.y;
      if (ddx && !ddy) slide(ddx > 0 ? 1 : -1, 0);
      else if (ddy && !ddx) slide(0, ddy > 0 ? 1 : -1);
    },
    key: function (k) {
      var m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[k];
      if (m) slide(m[0], m[1]);
      if (k === 'z' || k === 'Backspace') btns[0].onTap();
    },
    dbg: function () { return { p: p, anim: !!anim, clear: clear, pad: pad, map: g }; }
  };
}

// ─────────────────────────────────────────────
// 마지막 장: 케이라에게 추억 보여 주기
// ─────────────────────────────────────────────
var KAYRA_LINES = [
  { t: '루나는 내가 필요 없어. 혼자서도 빛나니까.', ok: ['m1', 'm5'], kind: '"루나는 언니를 정말 좋아해요. 언니가 준 걸 아직도 소중히 간직하고 있어요!"' },
  { t: '나는 언제나 그림자였어. 아무도 내 노래를 들어주지 않았어.', ok: ['m2', 'm6'], kind: '"언니 노래, 저희가 듣고 싶어요. 꼭 들려주세요!"' },
  { t: '나는 동생을 지켜 준 적도 없는 나쁜 언니야.', ok: ['m3'], kind: '"나쁜 언니라면, 루나가 이렇게 언니를 찾아오지 않았을 거예요."' },
  { t: '축하한다는 말 한 번 못 했어. 이제 와서 무슨 소용이야.', ok: ['m4', 'm8'], kind: '"지금 말해도 늦지 않았어요. 루나는 기다리고 있었어요."' },
  { t: '이 어둠은… 내가 원해서 고른 거야!', ok: ['m7'], kind: '"언니는 외로웠던 것뿐이에요. 어둠이 언니를 속인 거예요!"' }
];
function FinalScene() {
  save.scene = 'final_talk'; writeSave(); playBgm('sad'); // 'final'은 대화 장면 이름과 겹쳐서 분리
  IMG('bg/tower_top.png'); IMG('chars/kayra_queen.png'); IMG('chars/kayra_angry.png'); IMG('chars/kayra_crying.png');
  var li = 0, state = 'line', st = 0, reply = '', score = 0, tries = 0;
  var cards = [], kindBtn = null;
  function layout() {
    cards = SHARD_IDS.filter(hasShard).map(function (id, i, arr) {
      var n = arr.length, cw = Math.min(150, 1100 / Math.max(1, n) - 14);
      return { id: id, x: W / 2 - (n * (cw + 14) - 14) / 2 + i * (cw + 14), y: 760, w: cw, h: 190 };
    });
    kindBtn = Button(cards.length ? '마음을 담은 말로 대답하기' : '마음을 담아 대답하기', SX + 420, 975, 600, 84, function () { answer(null); }, '#b59cff');
  }
  function answer(id) {
    var L = KAYRA_LINES[li];
    if (id && L.ok.indexOf(id) >= 0) { score += tries ? 1 : 2; SFX.found(); reply = '추억 조각 「' + MEMORIES[id].title + '」을(를) 보여 주었다.'; state = 'reply'; st = 0; burst(W / 2, 400, 16, ['#ff8fc4', '#fff']); }
    else if (id) { tries++; SFX.miss(); reply = '케이라: "…그건 지금 내 마음이랑은 상관없어." (다른 조각을 골라 볼까?)'; state = 'wrong'; st = 0; }
    else { score += 1; SFX.tap(); reply = '오로라: ' + L.kind; state = 'reply'; st = 0; }
  }
  layout();
  return {
    update: function (dt) {
      st += dt;
      if (state === 'reply' && st > 2.6) {
        li++; tries = 0;
        if (li >= KAYRA_LINES.length) {
          state = 'done';
          save.heart += score; writeSave();
          var total = save.heart, sh = save.shards.length;
          var kind = total >= 11 && sh >= 6 ? 'true' : total >= 7 ? 'normal' : 'far';
          save.ending = save.ending === 'true' ? 'true' : kind; writeSave();
          clearChapter('final');
          startStory(kind === 'true' ? 'end_true' : kind === 'normal' ? 'end_normal' : 'end_far');
        } else { state = 'line'; st = 0; }
      }
      if (state === 'wrong' && st > 2.2) { state = 'line'; st = 0; }
      dirty = true;
    },
    draw: function () {
      drawBg('bg/tower_top.png', ['#20123a', '#3a1f5a']);
      var calm = li / KAYRA_LINES.length;
      ctx.fillStyle = 'rgba(40,10,60,' + (0.45 - calm * 0.35) + ')'; ctx.fillRect(0, 0, W, H);
      var face = li >= 4 ? 'chars/kayra_crying.png' : li >= 2 ? 'chars/kayra_queen.png' : 'chars/kayra_angry.png';
      drawImg(face, W / 2 - 260, 60, 520, 520);
      // 마음 게이지
      panel(SX + 30, 20, 400, 100, 'rgba(255,250,244,0.94)', '#ff8fc4');
      text('케이라의 마음', SX + 60, 50, 26, '#c45a9a', 'left', 900);
      for (var i = 0; i < KAYRA_LINES.length; i++) drawImg('items/heart.png', SX + 60 + i * 62, 68, 46, 46, i < li ? 1 : 0.25);
      panel(SX + 120, 560, 1200, 170, 'rgba(255,250,244,0.96)', '#c0395b');
      rr(SX + 160, 525, 220, 64, 32); ctx.fillStyle = '#c0395b'; ctx.fill(); text('케이라', SX + 270, 557, 34, '#fff', 'center', 900);
      if (state === 'line' || state === 'done') wrap('"' + KAYRA_LINES[Math.min(li, 4)].t + '"', 1100, 40).forEach(function (l, i) { text(l, SX + 170, 630 + i * 56, 40, '#4a3550', 'left', 700); });
      else wrap(reply, 1100, 36).forEach(function (l, i) { text(l, SX + 170, 625 + i * 52, 36, state === 'wrong' ? '#8b5cc4' : '#c45a9a', 'left', 700); });
      if (state === 'line') {
        cards.forEach(function (c) {
          panel(c.x, c.y, c.w, c.h, 'rgba(255,240,248,0.96)', '#ff8fc4');
          drawImg('items/memory_shard.png', c.x + c.w * 0.15, c.y + 14, c.w * 0.7, c.w * 0.7);
          wrap(MEMORIES[c.id].title, c.w - 16, 22).forEach(function (l, i) { text(l, c.x + c.w / 2, c.y + c.w * 0.7 + 40 + i * 28, 22, '#c45a9a', 'center', 800); });
        });
        drawButton(kindBtn);
      }
    },
    dbg: function () { return { state: state, li: li, cards: cards, kindBtn: kindBtn }; },
    tap: function (x, y) {
      if (state !== 'line') return;
      for (var i = 0; i < cards.length; i++) { var c = cards[i]; if (x > c.x && x < c.x + c.w && y > c.y && y < c.y + c.h) { answer(c.id); return; } }
      if (hit(kindBtn, x, y)) answer(null);
    }
  };
}

// ─────────────────────────────────────────────
// 엔딩 + 크레딧
// ─────────────────────────────────────────────
function EndingScene(kind) {
  save.scene = 'ending'; save.endKind = kind; writeSave(); playBgm('polka');
  var p2 = kind === 'p2', bgKey = p2 ? 'bg/cut_finale.png' : 'bg/ending.png';
  if (p2) clearChapter('ch9');
  IMG(bgKey);
  var t = 0;
  var title = { 'true': '진짜 엔딩 · 빛의 자매', normal: '엔딩 · 다시 함께', far: '엔딩 · 기다리는 등불', p2: '2부 엔딩 · 무지개 축제' }[kind];
  var lines = p2 ? ['오로라공주 2부 – 무지개 축제', '', '캐릭터 원작 · 이름 · ' + CREDIT_NAME, '그림 · 아스트라 (원작 그림을 바탕으로)', '이야기 · 게임 · 효과음 · Claude',
    '배경음악 · Aureolus_Omicron, MintoDog (CC0)', '', '무지개 리본 ' + save.ribbons.length + ' / 7   ·   만난 친구 ' + save.met.length + '명   ·   별 ' + save.stars,
    '', '"다른 모습이어도, 우리는 언제나 친구야."'] : ['오로라공주 – 빛과 어둠의 자매', '', '캐릭터 원작 · ' + CREDIT_NAME, '그림 · 아스트라 (원작 그림을 바탕으로)', '이야기 · 게임 · 효과음 · Claude',
    '배경음악 · Aureolus_Omicron, MintoDog (CC0)', '', '모은 추억 조각 ' + save.shards.length + ' / 8   ·   별 ' + save.stars,
    kind === 'true' ? '모든 추억을 모아 진짜 엔딩을 봤어요! 🌈' : '추억 조각을 더 모으면 다른 엔딩이 기다려요!', '', '"다른 모습이어도, 우리는 언제나 자매야."'];
  var btn = Button('타이틀로', SX + 520, 960, 400, 90, function () { go(TitleScene); });
  return {
    update: function (dt) { t += dt; dirty = true; if (Math.random() < 0.08) burst(SX + Math.random() * 1440, 0, 2); },
    draw: function () {
      drawBg(bgKey);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, 0, W, H);
      outlined(title, W / 2, 120, 70, '#fff', kind === 'true' || p2 ? '#ff6fae' : '#8b5cc4', 16);
      var y0 = 250 + Math.max(0, 300 - t * 80);
      panel(SX + 300, y0 - 50, 840, lines.length * 58 + 40, 'rgba(255,250,244,0.85)', '#ff8fc4');  // 밝은 배경 위 글씨 가독성
      lines.forEach(function (l, i) { if (l) text(l, W / 2, y0 + i * 58, i === 0 ? 44 : 34, i === 0 ? '#c45a9a' : '#4a3550', 'center', i === 0 ? 900 : 700); });
      if (t > 4) drawButton(btn);
    },
    tap: function (x, y) { if (t > 4) tapButtons([btn], x, y); }
  };
}

// ─────────────────────────────────────────────
// 메인 루프 (변화 없으면 그리지 않음 → 배터리 절약)
// ─────────────────────────────────────────────
var last = 0, lastScene = null;
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; T += dt;
  updateFade(dt);
  if (memoryPopup) { memoryPopup.t += dt; dirty = true; }
  if (sparks.length) { updateSparks(dt); dirty = true; }
  if (scene !== lastScene) { lastScene = scene; releaseImages(); }
  if (scene && scene.update) scene.update(dt);
  if (dirty) {
    dirty = false;
    ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, 0, 0);
    if (scene) scene.draw();
    drawSparks();
    if (memoryPopup) drawMemoryCard(memoryPopup.id, Math.min(1, memoryPopup.t * 2));
    drawMute();
    if (fade.a > 0) { ctx.fillStyle = 'rgba(255,248,252,' + fade.a + ')'; ctx.fillRect(0, 0, W, H); }
  }
  requestAnimationFrame(frame);
}
resize();
scene = TitleScene();
requestAnimationFrame(frame);
</script>
